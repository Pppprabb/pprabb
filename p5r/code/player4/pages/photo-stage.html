<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>照片舞台</title>

    <link rel="stylesheet" href="../../../shared/p5ui/css/p5-ui.css" />
    <link rel="stylesheet" href="../../shared/site.css" />
    <link rel="stylesheet" href="../characters.css" />
  </head>

  <body class="p5r-characters" data-p5r-page="photo-stage">
    <header class="p5r-header p5r-header--solid" role="banner">
      <div class="p5r-header__left">
        <img
          class="p5r-logo"
          src="../../../shared/p5ui/assets/src-assets/logo.png"
          alt="logo"
        />
      </div>

      <div class="p5r-header__right">
        <nav class="p5r-header__nav" aria-label="委托、公告、联系与人物">
          <details class="p5r-headerNav" id="p5rHeaderRequestsNav">
            <summary class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__summary">
              <span class="p5r-headerNav__summaryText">委托</span>
              <span class="p5r-headerNav__caret" aria-hidden="true"></span>
            </summary>
            <div class="p5r-headerNav__panel" role="group" aria-label="委托与我的任务">
              <a class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item" href="../../player3/pages/requests.html">委托</a>
              <a class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item" href="../../player3/pages/my-missions.html">我的任务</a>
            </div>
          </details>
          <a
            class="p5-btn-ctn p5-hover-animation-gray p5r-bulletinNavSolo"
            href="../../player1/pages/bulletins.html"
            >公告</a
          >
          <details class="p5r-headerNav" id="p5rHeaderContactNav">
            <summary class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__summary">
              <span class="p5r-headerNav__summaryText">联系</span>
              <span class="p5r-headerNav__caret" aria-hidden="true"></span>
            </summary>
            <div class="p5r-headerNav__panel" role="group" aria-label="联系与小游戏">
              <a class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item" href="../../player2/pages/contact.html">联系</a>
              <a class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item" href="../../player2/pages/takamaki-3d.html">小游戏</a>
            </div>
          </details>
          <details class="p5r-headerNav" id="p5rHeaderNav">
            <summary class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__summary">
              <span class="p5r-headerNav__summaryText">人物</span>
              <span class="p5r-headerNav__caret" aria-hidden="true"></span>
            </summary>
            <div class="p5r-headerNav__panel" role="group" aria-label="人物子页面">
              <a class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item" href="../../player4/pages/characters.html">人物</a>
              <a
                class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item is-current"
                href="../../player4/pages/photo-stage.html"
                aria-current="page"
                >照片舞台</a
              >
              <a class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item" href="../../player4/pages/book-flip.html">人物画册</a>
              <a class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item" href="../../player4/pages/card-draw.html">卡片抽取</a>
            </div>
          </details>
        </nav>
        <div class="p5r-headerUser" data-p5r-header-user>
          <div class="p5r-profileEntryWrap">
            <a id="profileEntry" class="p5-btn-ctn p5-hover-animation-gray" href="../../player4/pages/profile.html">个人中心</a>
            <div class="p5r-headerUserMenu" role="group" aria-label="账户操作">
              <button type="button" class="p5-btn-ctn p5-hover-animation-gray p5r-headerNav__item p5r-headerUserMenu__btn" data-p5r-logout>退出</button>
            </div>
          </div>
          <span class="p5r-headerUserName" id="p5rHeaderUserName">游客</span>
        </div>
      </div>
    </header>

    <main class="p5r-photoStageMain" aria-label="照片舞台">
      <div
        id="p5rPhotoStageIntro"
        class="p5r-photoStageIntro"
        data-hold-ms="1600"
        aria-label="雨宫莲动态素材过场"
      >
        <svg class="p5r-photoStageIntro__maskSvg" aria-hidden="true" focusable="false">
          <defs>
            <mask id="p5rIntroWaveMask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox" mask-type="luminance">
              <rect width="1" height="1" fill="black"></rect>
              <circle class="p5r-photoStageIntro__maskHole p5r-photoStageIntro__maskHole--1" cx="0.34" cy="0.36" r="0.03" fill="white"></circle>
              <circle class="p5r-photoStageIntro__maskHole p5r-photoStageIntro__maskHole--2" cx="0.72" cy="0.44" r="0.03" fill="white"></circle>
              <circle class="p5r-photoStageIntro__maskHole p5r-photoStageIntro__maskHole--3" cx="0.46" cy="0.74" r="0.03" fill="white"></circle>
              <circle class="p5r-photoStageIntro__maskHole p5r-photoStageIntro__maskHole--4" cx="0.16" cy="0.66" r="0.03" fill="white"></circle>
              <circle class="p5r-photoStageIntro__maskHole p5r-photoStageIntro__maskHole--5" cx="0.88" cy="0.62" r="0.03" fill="white"></circle>
            </mask>
            <!-- 退场：白底全显，黑圆扩散「盖住」画面，水波纹式消失（与入场挖孔相反） -->
            <mask id="p5rIntroWaveMaskOut" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox" mask-type="luminance">
              <rect width="1" height="1" fill="white"></rect>
              <circle class="p5r-photoStageIntro__maskEat p5r-photoStageIntro__maskEat--1" cx="0.34" cy="0.36" r="0.03" fill="black"></circle>
              <circle class="p5r-photoStageIntro__maskEat p5r-photoStageIntro__maskEat--2" cx="0.72" cy="0.44" r="0.03" fill="black"></circle>
              <circle class="p5r-photoStageIntro__maskEat p5r-photoStageIntro__maskEat--3" cx="0.46" cy="0.74" r="0.03" fill="black"></circle>
              <circle class="p5r-photoStageIntro__maskEat p5r-photoStageIntro__maskEat--4" cx="0.16" cy="0.66" r="0.03" fill="black"></circle>
              <circle class="p5r-photoStageIntro__maskEat p5r-photoStageIntro__maskEat--5" cx="0.88" cy="0.62" r="0.03" fill="black"></circle>
            </mask>
          </defs>
        </svg>
        <div class="p5r-photoStageIntro__bg" aria-hidden="true"></div>
        <div class="p5r-photoStageIntro__rings" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="p5r-photoStageIntro__frame">
          <img
            class="p5r-photoStageIntro__img"
            src="../../../皇家p5r/雨宫莲/动态素材.png"
            alt=""
            width="720"
            height="480"
            decoding="async"
          />
        </div>
      </div>
      <div class="p5r-photoStage p5r-photoStage--introPending" id="p5rPhotoStageRoot" aria-label="三维照片舞台">
        <div class="p5r-photoStage__floor" aria-hidden="true"></div>
        <div class="p5r-photoStage__uplight" aria-hidden="true"></div>
        <div class="p5r-photoStage__viewport">
          <div class="p5r-photoStage__rotor" id="p5rStageRotor">
            <button type="button" class="p5r-photoStage__card" data-index="0" style="--i: 0" aria-label="结城理，点击绕竖轴旋转一周">
              <span class="p5r-photoStage__cardFlip">
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--front">
                  <img src="../../../皇家p5r/p3结城理/人物 (3).png" alt="结城理" loading="lazy" />
                </span>
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--back" aria-hidden="true">
                  <img src="../../../皇家p5r/p3结城理/人物 (3).png" alt="" loading="lazy" />
                </span>
              </span>
              <span class="p5r-photoStage__label">结城理</span>
            </button>
            <button type="button" class="p5r-photoStage__card" data-index="1" style="--i: 1" aria-label="坂本龙司，点击绕竖轴旋转一周">
              <span class="p5r-photoStage__cardFlip">
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--front">
                  <img src="../../../皇家p5r/坂本龙司/版本龙司2.png" alt="坂本龙司" loading="lazy" />
                </span>
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--back" aria-hidden="true">
                  <img src="../../../皇家p5r/坂本龙司/版本龙司2.png" alt="" loading="lazy" />
                </span>
              </span>
              <span class="p5r-photoStage__label">坂本龙司</span>
            </button>
            <button type="button" class="p5r-photoStage__card" data-index="2" style="--i: 2" aria-label="芳泽霞，点击绕竖轴旋转一周">
              <span class="p5r-photoStage__cardFlip">
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--front">
                  <img src="../../../皇家p5r/芳泽霞/芳泽霞人物素材 (2).png" alt="芳泽霞" loading="lazy" />
                </span>
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--back" aria-hidden="true">
                  <img src="../../../皇家p5r/芳泽霞/芳泽霞人物素材 (2).png" alt="" loading="lazy" />
                </span>
              </span>
              <span class="p5r-photoStage__label">芳泽霞</span>
            </button>
            <button type="button" class="p5r-photoStage__card" data-index="3" style="--i: 3" aria-label="高卷杏，点击绕竖轴旋转一周">
              <span class="p5r-photoStage__cardFlip">
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--front">
                  <img src="../../../皇家p5r/高卷杏/人物素材1.png" alt="高卷杏" loading="lazy" />
                </span>
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--back" aria-hidden="true">
                  <img src="../../../皇家p5r/高卷杏/人物素材1.png" alt="" loading="lazy" />
                </span>
              </span>
              <span class="p5r-photoStage__label">高卷杏</span>
            </button>
            <button type="button" class="p5r-photoStage__card" data-index="4" style="--i: 4" aria-label="喜多川祐介，点击绕竖轴旋转一周">
              <span class="p5r-photoStage__cardFlip">
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--front">
                  <img src="../../../皇家p5r/喜多川祐介/5.png" alt="喜多川祐介" loading="lazy" />
                </span>
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--back" aria-hidden="true">
                  <img src="../../../皇家p5r/喜多川祐介/5.png" alt="" loading="lazy" />
                </span>
              </span>
              <span class="p5r-photoStage__label">喜多川祐介</span>
            </button>
            <button type="button" class="p5r-photoStage__card" data-index="5" style="--i: 5" aria-label="新岛真，点击绕竖轴旋转一周">
              <span class="p5r-photoStage__cardFlip">
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--front">
                  <img src="../../../皇家p5r/新岛真/人物素材.png" alt="新岛真" loading="lazy" />
                </span>
                <span class="p5r-photoStage__cardFace p5r-photoStage__cardFace--back" aria-hidden="true">
                  <img src="../../../皇家p5r/新岛真/人物素材.png" alt="" loading="lazy" />
                </span>
              </span>
              <span class="p5r-photoStage__label">新岛真</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="p5NotiHost" class="site-notiHost" aria-live="polite" aria-relevant="additions removals"></div>
    <div id="p5NotiTpl" class="p5-noti-ctn" style="display:none;">
      <div class="p5-noti-sub-ctn">
        <img class="p5-portrait-img" src="../../../shared/p5ui/assets/src-assets/images/portraits/mona.png" alt="" />
        <div class="p5-dialog-ctn">
          <img class="p5-dialog-img" src="../../../shared/p5ui/assets/src-assets/images/notification.png" alt="" />
          <div class="p5-noti-title">
            <p class="p5-title-ctn text-size-small"><span>摩尔 加纳</span></p>
          </div>
          <div class="p5-noti-text">通知示例</div>
        </div>
      </div>
    </div>

    <div id="p5MsgHost"></div>
    <div id="p5BackTop" class="p5-top-ctn" hidden style="right: 28px; bottom: 28px;">
      <img src="../../../shared/p5ui/assets/src-assets/images/back-top.png" alt="back top" />
    </div>
    <div id="p5Zoom" class="p5-zoom-ctn" style="display:none;">
      <div class="p5-zoom-sub-ctn">
        <img class="p5-zoom-img" src="" alt="zoom" />
        <img class="p5-zoom-close" src="../../../shared/p5ui/assets/src-assets/images/upload/close.png" alt="close" />
      </div>
    </div>

    <script src="../../shared/site.js"></script>
    <script src="../characters.js"></script>
    <script src="../photo-stage.js"></script>
  </body>
</html>
